  - "@shikijs/engine-javascript@4.6.0"
  - "@shikijs/engine-oniguruma@4.6.0"
  - "@shikijs/langs@4.6.0"
  - "@shikijs/primitive@4.6.0"
  - "@shikijs/themes@4.6.0"
  - "@shikijs/types@4.6.0"
  - astro@7.4.5
  - shiki@4.6.0

overrides:
  deepmerge-ts: ^8.0.2
  fflate: ^0.8.3
